version: '3.8'

services:
  db:
    image: postgres:15
    container_name: sensor-postgres-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sensordb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sensordb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: